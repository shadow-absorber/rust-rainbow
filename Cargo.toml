[package]
name = "catppuccin-rainbow"
version = "1.0.0"
authors = ["Catppuccin Org <releases@catppuccin.com>", "shadow_absorber <contact@shadowabsorber.com>"]
edition = "2021"
description = "🦀 Soothing pastel theme for Rust."
documentation = "https://docs.rs/catppuccin"
homepage = "https://github.com/shadow-absorber/rust-rainbow"
repository = "https://github.com/shadow-absorber/rust-rainbow"
license = "MIT"
keywords = ["catppuccin", "palette", "color", "colorscheme", "theme", "chadpuccin"]

[package.metadata.docs.rs]
features = ["ansi-term", "bevy", "css-colors", "iced", "ratatui", "serde"]

[lints]
rust.missing_docs = "warn"
clippy.all = "warn"
clippy.pedantic = "warn"
clippy.nursery = "warn"

[dependencies]
ansi_term = { version = "0.12", optional = true }
bevy = { version = "0.18", default-features = false, optional = true }
css-colors = { version = "1.0", optional = true }
iced = { version = "0.14", optional = true }
ratatui-core = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[build-dependencies]
itertools = "0.14"
prettyplease = "0.2"
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = "2.0"

[dev-dependencies]
crossterm = "0.29"
ratatui = "0.30"
serde_json = "1.0"

[features]
ansi-term = ["dep:ansi_term"]
bevy = ["bevy/bevy_color"]
bevy-full = ["bevy/default"]
css-colors = ["dep:css-colors"]
iced = ["dep:iced"]
ratatui = ["dep:ratatui-core"]
serde = ["dep:serde"]

[[example]]
name = "term_grid"
required-features = ["ansi-term"]

[[example]]
name = "bevy"
required-features = ["bevy-full"]

[[example]]
name = "css"
required-features = ["css-colors"]

[[example]]
name = "iced"
required-features = ["iced"]

[[example]]
name = "ratatui"
required-features = ["ratatui"]

[[example]]
name = "serde"
required-features = ["serde"]
